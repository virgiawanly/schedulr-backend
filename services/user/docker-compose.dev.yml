services:
  schedulr-user-db:
    image: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U schedulr -d schedulr_user" ]
      interval: 5s
      retries: 10
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "54323:5432"
    networks:
      - schedulr_user_network

networks:
  schedulr_user_network:
    driver: bridge