syntax = "proto3";

package schedulr.authentication.v1;

option go_package = "github.com/virgiawanly/schedulr-backend/protogen/go/authentication/v1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "proto/google/api/annotations.proto";

service AuthService {
  rpc CheckRegisteredEmail(CheckRegisteredEmailRequest) returns (CheckRegisteredEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/check-registered-email"
      body: "*"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse)  {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh-token"
      body: "*"
    };
  }
}

message Account {
  string id = 1;
  string business_id = 2;
  string email = 3;
  string password = 4;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
  google.protobuf.Timestamp deleted_at = 102;
}

message CheckRegisteredEmailRequest {
  string email = 1;
}

message CheckRegisteredEmailResponse {
  bool is_exist = 1;
}

message RegisterRequest {
  string first_name = 1;
  optional string last_name = 2;
  string email = 3;
  string password = 4;
  optional string phone = 5;
  optional string address_1 = 6;
  optional string address_2 = 7;
  optional string city = 8;
  optional string state = 9;
  optional string zipcode = 10;
  optional string country = 11;

  optional string business_name = 12;
  optional string business_company_size = 13;
  string business_industry = 14;
}

message RegisterResponse {
  string account_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  string refresh_token = 3;
  google.protobuf.Duration expiry_time = 4;
}

message RefreshTokenRequest {
  string token_type = 1;
  string access_token = 2;
}

message RefreshTokenResponse {
  string token_type = 1;
  string access_token = 2;
  google.protobuf.Duration expiry_time = 3;
}