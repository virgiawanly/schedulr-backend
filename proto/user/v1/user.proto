syntax = "proto3";

package schedulr.user.v1;

option go_package = "github.com/virgiawanly/schedulr-backend/protogen/go/user/v1";

import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUserFromRegistration(CreateUserFromRegistrationRequest) returns (CreateUserFromRegistrationResponse);
}

message User {
  string id = 1;
  string business_id = 2;
  string account_id = 3;
  string first_name = 4;
  string last_name = 5;
  string phone = 6;
  string address_1 = 7;
  string address_2 = 8;
  string city = 9;
  string state = 10;
  string zipcode = 11;
  string country = 12;
  string image_path = 13;
  string language = 14;
  double labour_cost = 15;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
  google.protobuf.Timestamp deleted_at = 102;
}

message CreateUserFromRegistrationRequest {
  string business_id = 1;
  string account_id = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string address_1 = 6;
  string address_2 = 7;
  string city = 8;
  string state = 9;
  string zipcode = 10;
  string country = 11;
}

message CreateUserFromRegistrationResponse {
  User user = 1;
}